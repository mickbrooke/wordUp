<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>QuadraWord</title>
  <style>
    :root {
      --app-height: 100dvh;
      --bg-gradient: linear-gradient(180deg, #0972b2 0%, #064c7e 45%, #032d4e 100%);
      --card-bg: rgba(6, 40, 68, 0.88);
      --card-border: rgba(255, 255, 255, 0.16);
      --tile-bg: #fffbf0;
      --tile-border: #f1dfbc;
      --tile-shadow: #e09f41;
      --tile-text: #1d2538;
      --tile-sel-bg: linear-gradient(135deg, #bd37ec 0%, #8719d3 100%);
      --tile-sel-shadow: #5d0f94;
      --tile-sel-text: #ffffff;
      --ladder-bg: rgba(255, 255, 255, 0.18);
      --ladder-border: rgba(255, 255, 255, 0.32);
      --ladder-solved-bg: linear-gradient(135deg, #a836eb 0%, #7e17cb 100%);
      --ladder-solved-border: #dca7ff;
    }

    /* Theme 2: Sunset Reef */
    [data-theme="sunset"] {
      --bg-gradient: linear-gradient(180deg, #ff5e62 0%, #a83279 50%, #2b1055 100%);
      --card-bg: rgba(43, 16, 85, 0.88);
      --tile-bg: #fff5f5;
      --tile-border: #ffd6d6;
      --tile-shadow: #d94b78;
      --tile-text: #2b1055;
      --tile-sel-bg: linear-gradient(135deg, #ff9966 0%, #ff5e62 100%);
      --tile-sel-shadow: #9e1f24;
      --ladder-solved-bg: linear-gradient(135deg, #ff9966 0%, #ff5e62 100%);
      --ladder-solved-border: #ffe0cc;
    }

    /* Theme 3: Neon Abyss (Dark Synth) */
    [data-theme="synth"] {
      --bg-gradient: linear-gradient(180deg, #141e30 0%, #0f0c29 50%, #05050a 100%);
      --card-bg: rgba(15, 12, 41, 0.92);
      --tile-bg: #1e293b;
      --tile-border: #38bdf8;
      --tile-shadow: #0284c7;
      --tile-text: #f8fafc;
      --tile-sel-bg: linear-gradient(135deg, #f43f5e 0%, #a855f7 100%);
      --tile-sel-shadow: #6b21a8;
      --ladder-solved-bg: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
      --ladder-solved-border: #a5f3fc;
    }

    /* Theme 4: Kelp Forest */
    [data-theme="forest"] {
      --bg-gradient: linear-gradient(180deg, #136a8a 0%, #0f4c3a 50%, #06231d 100%);
      --card-bg: rgba(6, 35, 29, 0.88);
      --tile-bg: #f4fce3;
      --tile-border: #d8f5a2;
      --tile-shadow: #5c940d;
      --tile-text: #06231d;
      --tile-sel-bg: linear-gradient(135deg, #f59f00 0%, #e67700 100%);
      --tile-sel-shadow: #9c36b5;
      --ladder-solved-bg: linear-gradient(135deg, #2b8a3e 0%, #087f5b 100%);
      --ladder-solved-border: #b2f2bb;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: var(--app-height);
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: #010d18;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: fixed;
      inset: 0;
    }

    .game-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: var(--app-height);
      max-height: var(--app-height);
      background: var(--bg-gradient);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      transition: background 0.35s ease;
    }

    #confettiCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 250;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: var(--bg-gradient);
      z-index: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.4s ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffd24d;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-weight: 800;
      font-size: 15px;
      color: #ffe893;
    }

    .bubble-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .bubble {
      position: absolute;
      bottom: -40px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.05));
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      animation: rise linear infinite;
    }

    @keyframes rise {
      0% { transform: translateY(0) translateX(0) scale(0.8); opacity: 0.2; }
      50% { transform: translateY(-400px) translateX(14px) scale(1.05); opacity: 0.5; }
      100% { transform: translateY(-850px) translateX(-10px) scale(1.2); opacity: 0; }
    }

    header {
      position: relative;
      z-index: 10;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: max(8px, env(safe-area-inset-top)) 12px 4px;
    }

    .level-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-num {
      width: 34px;
      height: 34px;
      background: #f7b928;
      border: 2px solid #ffe893;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
      border-radius: 50%;
      color: #1a1608;
      font-weight: 900;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title-group h1 {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .title-group span.tag {
      font-size: 9px;
      background: #eb2f74;
      color: #fff;
      padding: 2px 5px;
      border-radius: 7px;
      font-weight: 800;
    }

    .title-group p {
      font-size: 10px;
      opacity: 0.85;
      font-weight: 600;
    }

    .top-stats {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .score-chip {
      background: rgba(4, 30, 52, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 4px 9px;
      font-weight: 800;
      font-size: 12px;
      color: #ffd24d;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      width: 31px;
      height: 31px;
      border-radius: 50%;
      background: rgba(4, 30, 52, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
    }

    .sub-bar {
      position: relative;
      z-index: 10;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 14px 4px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .sub-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-hint-inline {
      background: linear-gradient(135deg, #f5a623 0%, #d4820a 100%);
      color: #fff;
      border: 1px solid rgba(255, 240, 180, 0.6);
      border-radius: 10px;
      padding: 3px 9px;
      font-weight: 900;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      box-shadow: 0 2px 0 #8f5303, 0 3px 6px rgba(0,0,0,0.25);
    }

    .btn-hint-inline:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 #8f5303;
    }

    .bonus-pill {
      background: #df9e19;
      color: #3b2302;
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 900;
    }

    .ladder-board {
      position: relative;
      z-index: 10;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 2px 10px;
      overflow-y: auto;
    }

    .word-row {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }

    .ladder-cell {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--ladder-bg);
      border: 2px solid var(--ladder-border);
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.25), 0 2px 5px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 900;
      color: #fff;
      transition: all 0.3s ease;
    }

    .ladder-cell.solved {
      background: var(--ladder-solved-bg);
      border-color: var(--ladder-solved-border);
      box-shadow: 0 3px 0 rgba(0,0,0,0.35), 0 5px 10px rgba(0,0,0,0.3);
      animation: popSolved 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popSolved {
      0% { transform: scale(0.6); opacity: 0; }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    .spelled-banner-container {
      position: relative;
      z-index: 10;
      flex-shrink: 0;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2px;
    }

    .spelled-banner {
      min-width: 140px;
      height: 30px;
      padding: 0 18px;
      border-radius: 15px;
      background: rgba(15, 12, 41, 0.72);
      border: 2px solid rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .spelled-banner.shake {
      animation: bannerShake 0.35s ease;
      background: rgba(180, 20, 40, 0.75);
      border-color: #ff6e87;
    }

    @keyframes bannerShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .bank-deck {
      position: relative;
      z-index: 10;
      flex-shrink: 0;
      width: 100%;
      background: var(--card-bg);
      border-top: 2px solid var(--card-border);
      border-radius: 22px 22px 0 0;
      padding: 10px 12px calc(18px + env(safe-area-inset-bottom, 12px));
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.35s ease;
    }

    .grid-wrapper {
      position: relative;
      width: 100%;
      touch-action: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .svg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .tiles-grid {
      position: relative;
      z-index: 3;
      display: grid;
      gap: 7px;
      width: 100%;
      height: 100%;
      touch-action: none;
      justify-items: center;
      align-items: center;
    }

    .tile-slot {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tile {
      width: 52px;
      height: 52px;
      background: var(--tile-bg);
      border: 2px solid var(--tile-border);
      border-radius: 13px;
      box-shadow: 0 4px 0 var(--tile-shadow), 0 5px 8px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      position: relative;
      transition: transform 0.1s ease, background 0.1s ease;
    }

    .tile .char {
      font-size: 22px;
      font-weight: 900;
      color: var(--tile-text);
      line-height: 1;
    }

    .tile .word-count {
      position: absolute;
      top: 2px;
      right: 3px;
      min-width: 15px;
      height: 15px;
      padding: 0 3px;
      background: #0d68a8;
      color: #ffffff;
      border-radius: 8px;
      font-size: 9px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tile .word-count.bump {
      animation: badgeBump 0.35s ease;
    }

    @keyframes badgeBump {
      0% { transform: scale(1); }
      50% { transform: scale(1.35); background: #eb2f74; }
      100% { transform: scale(1); }
    }

    .tile.selected {
      background: var(--tile-sel-bg);
      border-color: #d687ff;
      box-shadow: 0 4px 0 var(--tile-sel-shadow), 0 6px 14px rgba(189, 55, 236, 0.45);
      transform: translateY(-3px) scale(1.05);
    }

    .tile.selected .char { color: #fff; }
    .tile.selected .word-count { background: #ffd24d; color: #2b1142; }

    .tile.hint-flash {
      animation: hintGlow 0.6s infinite alternate;
      border-color: #ffe66d;
    }

    @keyframes hintGlow {
      from { box-shadow: 0 0 6px #ffd54f; }
      to { box-shadow: 0 0 18px #ff9800; transform: scale(1.06); }
    }

    .tile.dismissed {
      animation: tilePopOut 0.4s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    @keyframes tilePopOut {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2) rotate(10deg); opacity: 0.8; }
      100% { transform: scale(0) rotate(-20deg); opacity: 0; }
    }

    .float-chip {
      position: absolute;
      font-size: 14px;
      font-weight: 900;
      color: #ffd533;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      pointer-events: none;
      z-index: 100;
      animation: floatUp 0.8s forwards ease-out;
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0) scale(0.7); }
      20% { opacity: 1; transform: translateY(-8px) scale(1.1); }
      100% { opacity: 0; transform: translateY(-40px) scale(1); }
    }

    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 18, 33, 0.88);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      position: relative;
      width: 88%;
      max-width: 330px;
      background: linear-gradient(180deg, #184877 0%, #0d2847 100%);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: 20px 16px 18px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      overflow: hidden;
    }

    .modal-card.flawless-glow {
      background: linear-gradient(180deg, #3a1c71 0%, #1c2541 100%);
      border: 3px solid #ffd700;
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.4), 0 16px 40px rgba(0,0,0,0.7);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .flawless-emblem {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-bottom: 8px;
    }

    .flawless-emblem.show {
      display: flex;
    }

    .trophy-svg-wrap {
      position: relative;
      width: 74px;
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .starburst-rays {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg 15deg,
        rgba(255, 215, 0, 0.28) 15deg 30deg,
        transparent 30deg 45deg,
        rgba(255, 215, 0, 0.28) 45deg 60deg,
        transparent 60deg 75deg,
        rgba(255, 215, 0, 0.28) 75deg 90deg,
        transparent 90deg 105deg,
        rgba(255, 215, 0, 0.28) 105deg 120deg,
        transparent 120deg 135deg,
        rgba(255, 215, 0, 0.28) 135deg 150deg,
        transparent 150deg 165deg,
        rgba(255, 215, 0, 0.28) 165deg 180deg,
        transparent 180deg 195deg,
        rgba(255, 215, 0, 0.28) 195deg 210deg,
        transparent 210deg 225deg,
        rgba(255, 215, 0, 0.28) 225deg 240deg,
        transparent 240deg 255deg,
        rgba(255, 215, 0, 0.28) 255deg 270deg,
        transparent 270deg 285deg,
        rgba(255, 215, 0, 0.28) 285deg 300deg,
        transparent 300deg 315deg,
        rgba(255, 215, 0, 0.28) 315deg 360deg
      );
      animation: spinRays 10s linear infinite;
    }

    @keyframes spinRays {
      to { transform: rotate(360deg); }
    }

    .flawless-ribbon {
      margin-top: 4px;
      background: linear-gradient(90deg, #ff9800, #ffd700, #ff9800);
      color: #2b1200;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 12px;
      border-radius: 12px;
      letter-spacing: 0.8px;
      box-shadow: 0 2px 8px rgba(255, 215, 0, 0.4);
    }

    .modal-card h2 {
      font-size: 21px;
      font-weight: 900;
      color: #ffe66d;
      margin-bottom: 3px;
    }

    .modal-card p.subtitle {
      font-size: 12px;
      opacity: 0.85;
      margin-bottom: 12px;
    }

    .stats-summary {
      background: rgba(2, 16, 30, 0.5);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      justify-content: space-around;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-item .val {
      font-size: 18px;
      font-weight: 900;
      color: #64ffda;
    }

    .stat-item .lbl {
      font-size: 9px;
      opacity: 0.75;
      text-transform: uppercase;
      font-weight: 700;
    }

    .modal-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #1fa75f 0%, #157943 100%);
      border: 2px solid #57ea9c;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 900;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(31, 167, 95, 0.4);
    }

    .modal-btn:active {
      transform: translateY(2px);
    }
  </style>
</head>
<body>

  <div class="game-container" id="gameApp">
    <canvas id="confettiCanvas"></canvas>

    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text" id="loadingText">Loading Everyday Words...</div>
    </div>

    <div class="bubble-layer" id="bubbleLayer"></div>

    <header>
      <div class="level-badge">
        <div class="badge-num" id="levelNum">1</div>
        <div class="title-group">
          <h1>QuadraWord <span class="tag" id="zoneTag">2x5</span></h1>
          <p id="dictStatus">Ocean Tide</p>
        </div>
      </div>
      <div class="top-stats">
        <div class="score-chip">✨ <span id="scoreVal">0</span></div>
        <button class="icon-btn" id="themeBtn" title="Switch Theme">🎨</button>
        <button class="icon-btn" id="leaderboardBtn" title="Leaderboard">🏆</button>
        <button class="icon-btn" id="soundBtn" title="Toggle Sound">🔊</button>
      </div>
    </header>

    <div class="sub-bar">
      <div class="sub-left">
        <div>WORDS TO FIND: <span id="solvedCount">0</span>/<span id="totalCount">5</span></div>
        <button class="btn-hint-inline" id="hintBtn">💡 Hint</button>
      </div>
      <div class="bonus-pill">Bonus: <span id="bonusCount">0</span></div>
    </div>

    <div class="ladder-board" id="ladderBoard"></div>

    <div class="spelled-banner-container">
      <div class="spelled-banner" id="spelledBanner"></div>
    </div>

    <div class="bank-deck">
      <div class="grid-wrapper" id="gridWrapper">
        <svg class="svg-canvas" id="svgCanvas"></svg>
        <div class="tiles-grid" id="tilesGrid"></div>
      </div>
    </div>

    <!-- Victory Modal -->
    <div class="modal-overlay" id="victoryModal">
      <div class="modal-card" id="victoryCard">
        <div class="flawless-emblem" id="flawlessEmblem">
          <div class="trophy-svg-wrap">
            <div class="starburst-rays"></div>
            <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" style="position:relative; z-index:2;">
              <path d="M16 10H48V24C48 32.8366 40.8366 40 32 40C23.1634 40 16 32.8366 16 24V10Z" fill="#FFD700" stroke="#FFF3B0" stroke-width="2"/>
              <path d="M16 14H8V22C8 27.5228 11.5817 32 16 32V14Z" fill="#FFA000" stroke="#FFF3B0" stroke-width="2"/>

    class SoundFX {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      tap() {
        if (!this.enabled) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(420, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(680, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.06);
      }
      success() {
        if (!this.enabled) return;
        this.init();
        const notes = [440, 554, 659, 880];
        notes.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.08);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.08 + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + i * 0.08);
          osc.stop(this.ctx.currentTime + i * 0.08 + 0.22);
        });
      }
      victory(isFlawless = false) {
        if (!this.enabled) return;
        this.init();
        const fanfare = isFlawless
          ? [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00]
          : [523.25, 659.25, 783.99, 1046.50, 880, 1046.50];
        fanfare.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = isFlawless ? 'triangle' : 'sine';
          const t = this.ctx.currentTime + i * 0.11;
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.38);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.4);
        });
      }
      pop() {
        if (!this.enabled) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(900, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.13);
      }
      error() {
        if (!this.enabled) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, this.ctx.currentTime);
        osc.frequency.setValueAtTime(130, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.26);
      }
    }

    function launchFlawlessCelebrationGraphic() {
      confettiCanvas.width = confettiCanvas.parentElement.clientWidth;
      confettiCanvas.height = confettiCanvas.parentElement.clientHeight;
      confettiParticles = [];

      const colors = ['#FFD700', '#FF4081', '#00E5FF', '#69F0AE', '#FFAB40', '#E040FB', '#FFFFFF'];

      for (let i = 0; i < 90; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        confettiParticles.push({
          x: confettiCanvas.width / 2,
          y: confettiCanvas.height * 0.4,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          size: Math.random() * 7 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 10,
          isStar: Math.random() < 0.35,
          alpha: 1
        });
      }

      if (confettiAnimId) cancelAnimationFrame(confettiAnimId);

      function renderConfetti() {
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        let active = false;

        for (const p of confettiParticles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.15;
          p.vx *= 0.99;
          p.rotation += p.rotSpeed;
          p.alpha -= 0.007;

          if (p.alpha > 0 && p.y < confettiCanvas.height + 20) {
            active = true;
            confettiCtx.save();
            confettiCtx.globalAlpha = Math.max(0, p.alpha);
            confettiCtx.translate(p.x, p.y);
            confettiCtx.rotate((p.rotation * Math.PI) / 180);
            confettiCtx.fillStyle = p.color;

            if (p.isStar) {
              confettiCtx.beginPath();
              const r = p.size;
              confettiCtx.moveTo(0, -r);
              confettiCtx.quadraticCurveTo(0, 0, r, 0);
              confettiCtx.quadraticCurveTo(0, 0, 0, r);
              confettiCtx.quadraticCurveTo(0, 0, -r, 0);
              confettiCtx.quadraticCurveTo(0, 0, 0, -r);
              confettiCtx.fill();
            } else {
              confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            }
            confettiCtx.restore();
          }
        }

        if (active) {
          confettiAnimId = requestAnimationFrame(renderConfetti);
        } else {
          confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        }
      }

      renderConfetti();
    }

    function stopConfetti() {
      if (confettiAnimId) cancelAnimationFrame(confettiAnimId);

    function isEasyEverydayWord(word) {
      if (JUNK_WORD_BLACKLIST.has(word)) return false;
      if (word.length === 3) {
        return FAMILIAR_3_LETTER_WORDS.has(word);
      }
      if (!/[AEIOU]/.test(word)) return false;
      if (/(.)\1\1/.test(word)) return false;
      if (/[BCDFGHJKLMNPQRSTVWXZ]{4,}/.test(word)) return false;
      return true;
    }

    async function loadDictionaries() {
      try {
        loadingText.textContent = 'Loading Everyday Vocabulary...';
        const [commonRes, fullRes] = await Promise.all([
          fetch(EVERYDAY_WORDS_URL),
          fetch(FULL_DICT_URL)
        ]);

        const commonText = await commonRes.text();
        const fullJson = await fullRes.json();

        fullJson.forEach(w => {
          const upper = w.trim().toUpperCase();
          if (upper.length >= 3 && upper.length <= 10 && /^[A-Z]+$/.test(upper)) {
            fullDictionarySet.add(upper);
          }
        });

        const seen = new Set();
        FAMILIAR_3_LETTER_WORDS.forEach(w => {
          if (fullDictionarySet.has(w)) {
            easyWordsList.push(w);
            seen.add(w);
          }
        });

        const lines = commonText.split(/\r?\n/);
        for (let i = 0; i < Math.min(lines.length, 2200); i++) {
          const upper = lines[i].trim().toUpperCase();
          if (!seen.has(upper) && upper.length >= 4 && upper.length <= 6 && /^[A-Z]+$/.test(upper)) {
            if (fullDictionarySet.has(upper) && isEasyEverydayWord(upper)) {
              easyWordsList.push(upper);
              seen.add(upper);
            }
          }
        }

        loadingOverlay.classList.add('hidden');
        startNewBoard();
      } catch (err) {
        console.error('Dictionary fetch error:', err);
        loadingText.textContent = 'Network Error.';
      }
    }

    function generateCompleteInclusionBoard() {
      const vowels = ['A', 'E', 'I', 'O', 'U'];
      const commonConsonants = ['R', 'S', 'T', 'L', 'N', 'C', 'D', 'M', 'P', 'B', 'G', 'H', 'F', 'W', 'K'];

      const rowsOptions = [2, 3];
      const colsOptions = [3, 4, 5];

      let bestFallback = null;
      let smallestDiff = Infinity;

      for (let attempt = 0; attempt < 450; attempt++) {
        const rows = rowsOptions[Math.floor(Math.random() * rowsOptions.length)];
        const cols = colsOptions[Math.floor(Math.random() * colsOptions.length)];
        const totalTiles = rows * cols;

        const numVowels = totalTiles <= 8 ? 2 : 3;
        const numConsonants = totalTiles - numVowels;

        const vPool = [...vowels].sort(() => Math.random() - 0.5).slice(0, numVowels);
        const cPool = [...commonConsonants].sort(() => Math.random() - 0.5).slice(0, numConsonants);
        const boardLetters = [...vPool, ...cPool].sort(() => Math.random() - 0.5);

        const grid = [];
        for (let r = 0; r < rows; r++) {
          grid.push(boardLetters.slice(r * cols, (r + 1) * cols));
        }

        const tempTiles = [];
        let idx = 0;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            tempTiles.push({ r, c, char: grid[r][c], index: idx++ });
          }
        }

        const boardChars = new Set(boardLetters);
        const allPlayableEasyWords = [];
        const coveredIndices = new Set();

        for (const word of easyWordsList) {
          let possible = true;
          for (let i = 0; i < word.length; i++) {
            if (!boardChars.has(word[i])) {
              possible = false;
              break;
            }
          }
          if (possible) {
            const path = findWordPath(word, tempTiles);
            if (path !== null) {
              allPlayableEasyWords.push(word);
              path.forEach(pIdx => coveredIndices.add(pIdx));
            }
          }
        }

        if (coveredIndices.size === totalTiles && allPlayableEasyWords.length >= 4) {
          if (allPlayableEasyWords.length <= 6) {
            allPlayableEasyWords.sort((a, b) => a.length - b.length || a.localeCompare(b));
            return { rows, cols, grid, targets: allPlayableEasyWords };
          }

          const diff = allPlayableEasyWords.length - 6;
          if (diff < smallestDiff) {
            smallestDiff = diff;
            allPlayableEasyWords.sort((a, b) => a.length - b.length || a.localeCompare(b));
            bestFallback = {
              rows,
              cols,
              grid,
              targets: allPlayableEasyWords.slice(0, 6)
            };
          }
        }
      }

      return bestFallback;
    }

    function getWordCountForChar(char) {
      const remainingTargets = currentTargets.filter(w => !solvedTargets.has(w));
      let count = 0;
      for (const word of remainingTargets) {
        if (word.includes(char)) count++;
      }
      return count;
    }

    function updateTileWordCounts(animate = false) {
      gridTiles.forEach(t => {
        if (t.dismissed) return;
        const badgeEl = t.el.querySelector('.word-count');
        if (!badgeEl) return;

        const newCount = getWordCountForChar(t.char);
        const oldCount = parseInt(badgeEl.textContent, 10);
        badgeEl.textContent = newCount;

        if (animate && oldCount !== newCount && newCount > 0) {
          badgeEl.classList.remove('bump');
          void badgeEl.offsetWidth;
          badgeEl.classList.add('bump');
        }
      });
    }

    function startNewBoard() {
      stopConfetti();
      syncMobileViewportHeight();

      let generated = generateCompleteInclusionBoard();
      while (!generated) {
        generated = generateCompleteInclusionBoard();
      }

      currentRows = generated.rows;
      currentCols = generated.cols;
      currentGrid = generated.grid;
      currentTargets = generated.targets;

      zoneTag.textContent = `${currentRows}×${currentCols}`;
      dictStatus.textContent = `${THEMES[currentThemeIdx].name} • ${currentTargets.length} Words`;

      solvedTargets.clear();
      bonusWordsFound.clear();
      activePath = [];
      wrongGuessesOnBoard = 0;
      totalAttemptsOnBoard = 0;
      victoryModal.classList.remove('active');
      victoryCard.classList.remove('flawless-glow');
      flawlessEmblem.classList.remove('show');

      levelNum.textContent = boardNumber;
      updateHeaderStats();

      ladderBoard.innerHTML = '';
      currentTargets.forEach(word => {
        const row = document.createElement('div');
        row.className = 'word-row';
        row.dataset.word = word;
        for (let i = 0; i < word.length; i++) {
          const cell = document.createElement('div');
          cell.className = 'ladder-cell';
          cell.dataset.index = i;
          row.appendChild(cell);
        }
        ladderBoard.appendChild(row);
      });

      const rowHeight = currentRows === 3 ? 52 : 58;
      gridWrapper.style.height = `${currentRows * rowHeight + (currentRows - 1) * 7}px`;
      tilesGrid.style.gridTemplateColumns = `repeat(${currentCols}, 1fr)`;
      tilesGrid.style.gridTemplateRows = `repeat(${currentRows}, 1fr)`;
      tilesGrid.style.maxWidth = `${currentCols * 64}px`;

      tilesGrid.innerHTML = '';
      gridTiles = [];
      let index = 0;
      for (let r = 0; r < currentRows; r++) {
        for (let c = 0; c < currentCols; c++) {
          const char = currentGrid[r][c];
          const slot = document.createElement('div');
          slot.className = 'tile-slot';

          const tile = document.createElement('div');
          tile.className = 'tile';
          if (currentRows === 3) {
            tile.style.height = '48px';
            tile.style.width = '50px';
          }
          tile.dataset.index = index;
          tile.dataset.r = r;
          tile.dataset.c = c;
          tile.dataset.char = char;

          const wordCount = getWordCountForChar(char);
          tile.innerHTML = `
            <span class="word-count">${wordCount}</span>
            <span class="char">${char}</span>
          `;

          slot.appendChild(tile);
          tilesGrid.appendChild(slot);

          gridTiles.push({
            el: tile,
            r,
            c,
            char,
            index,
            dismissed: false
          });
          index++;
        }
      }

      setupPointerEvents();
      updateBanner();
    }

    function updateHeaderStats() {
      scoreVal.textContent = score;
      solvedCount.textContent = solvedTargets.size;
      totalCount.textContent = currentTargets.length;
      bonusCount.textContent = bonusWordsFound.size;
    }

    function isOrthogonal(t1, t2) {
      return (Math.abs(t1.r - t2.r) + Math.abs(t1.c - t2.c) === 1);
    }

    function findWordPath(word, availableTiles) {
      function search(currTile, charIdx, visited) {
        if (charIdx === word.length) return Array.from(visited);
        const nextChar = word[charIdx];
        for (const nextTile of availableTiles) {
          if (!visited.has(nextTile.index) && nextTile.char === nextChar && isOrthogonal(currTile, nextTile)) {
            visited.add(nextTile.index);
            const res = search(nextTile, charIdx + 1, visited);
            if (res) return res;
            visited.delete(nextTile.index);
          }
        }
        return null;
      }

      const firstChar = word[0];
      const startTiles = availableTiles.filter(t => t.char === firstChar);
      for (const start of startTiles) {
        const visited = new Set([start.index]);
        const res = search(start, 1, visited);
        if (res) return res;
      }
      return null;
    }

    function pruneUnneededLetters() {
      const remainingTargets = currentTargets.filter(w => !solvedTargets.has(w));
      updateTileWordCounts(true);

      if (remainingTargets.length === 0) {
        gridTiles.forEach(t => {
          if (!t.dismissed) {
            t.dismissed = true;
            t.el.classList.add('dismissed');
          }
        });
        triggerVictory();
        return;
      }

      const maxNeededPerChar = {};
      remainingTargets.forEach(word => {
        const counts = {};
        for (const ch of word) counts[ch] = (counts[ch] || 0) + 1;
        for (const [ch, cnt] of Object.entries(counts)) {
          maxNeededPerChar[ch] = Math.max(maxNeededPerChar[ch] || 0, cnt);
        }
      });

      const activeTiles = gridTiles.filter(t => !t.dismissed);

      for (let i = activeTiles.length - 1; i >= 0; i--) {
        const candidate = activeTiles[i];
        const char = candidate.char;
        const needed = maxNeededPerChar[char] || 0;
        const currentCopies = activeTiles.filter(t => t.char === char);

        if (needed === 0 || currentCopies.length > needed) {
          const simulatedTiles = activeTiles.filter(t => t.index !== candidate.index);
          const allValid = remainingTargets.every(target => findWordPath(target, simulatedTiles) !== null);
          if (allValid) {
            candidate.dismissed = true;
            candidate.el.classList.add('dismissed');
            sound.pop();
            activeTiles.splice(i, 1);
          }
        }
      }
    }

    function triggerVictory() {
      const isFlawless = (wrongGuessesOnBoard === 0);

      if (isFlawless) {
        score += 250;
        updateHeaderStats();
        victoryCard.classList.add('flawless-glow');
        flawlessEmblem.classList.add('show');
        victoryTitle.textContent = 'PERFECT CLEAR!';
        victorySubtitle.textContent = '0 mistakes on this board!';
      } else {
        victoryCard.classList.remove('flawless-glow');
        flawlessEmblem.classList.remove('show');
        victoryTitle.textContent = 'BOARD CLEARED!';
        victorySubtitle.textContent = 'Ready for the next mobile reef?';
      }

      const accuracy = totalAttemptsOnBoard > 0
        ? Math.round(((totalAttemptsOnBoard - wrongGuessesOnBoard) / totalAttemptsOnBoard) * 100)
        : 100;

      sound.victory(isFlawless);
      finalScore.textContent = score;
      finalBonus.textContent = bonusWordsFound.size;
      finalAccuracy.textContent = `${accuracy}%`;

      setTimeout(() => {
        victoryModal.classList.add('active');
        if (isFlawless) launchFlawlessCelebrationGraphic();
      }, 500);
    }

    function setupPointerEvents() {
      const wrapper = document.getElementById('gridWrapper');

      wrapper.onpointerdown = (e) => {
        sound.init();
        const tileEl = e.target.closest('.tile');
        if (!tileEl) return;
        const tile = gridTiles[parseInt(tileEl.dataset.index, 10)];
        if (!tile || tile.dismissed) return;

        isDragging = true;
        activePath = [tile.index];
        tile.el.classList.add('selected');
        sound.tap();
        updateBanner();
        drawTrail();
      };

      window.onpointermove = (e) => {
        if (!isDragging) return;
        const el = document.elementFromPoint(e.clientX, e.clientY);
        if (!el) return;
        const tileEl = el.closest('.tile');
        if (!tileEl) return;

        const tile = gridTiles[parseInt(tileEl.dataset.index, 10)];
        if (!tile || tile.dismissed) return;

        const lastIdx = activePath[activePath.length - 1];
        if (tile.index === lastIdx) return;

        if (activePath.length > 1 && tile.index === activePath[activePath.length - 2]) {
          const removedIdx = activePath.pop();
          gridTiles[removedIdx].el.classList.remove('selected');
          sound.tap();
          updateBanner();
          drawTrail();
          return;
        }

        const lastTile = gridTiles[lastIdx];
        if (!activePath.includes(tile.index) && isOrthogonal(lastTile, tile)) {
          activePath.push(tile.index);
          tile.el.classList.add('selected');
          sound.tap();
          updateBanner();
          drawTrail();
        }
      };

      window.onpointerup = () => {
        if (!isDragging) return;
        isDragging = false;
        if (activePath.length >= 3) {
          submitWord();
        } else {
          clearSelection();
        }
      };
    }

    function updateBanner() {
      const word = activePath.map(idx => gridTiles[idx].char).join('');
      spelledBanner.textContent = word;
    }

    function clearSelection() {
      activePath.forEach(idx => gridTiles[idx].el.classList.remove('selected'));
      activePath = [];
      updateBanner();
      drawTrail();
    }

    function drawTrail() {
      svgCanvas.innerHTML = '';
      if (activePath.length < 2) return;

      const wrapperRect = document.getElementById('gridWrapper').getBoundingClientRect();
      let d = '';

      activePath.forEach((idx, i) => {
        const rect = gridTiles[idx].el.getBoundingClientRect();
        const x = rect.left + rect.width / 2 - wrapperRect.left;
        const y = rect.top + rect.height / 2 - wrapperRect.top;
        d += (i === 0 ? `M ${x} ${y}` : ` L ${x} ${y}`);
      });

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', THEMES[currentThemeIdx].trail);
      path.setAttribute('stroke-width', '7');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
      svgCanvas.appendChild(path);
    }

    function showFloatScore(text, x, y) {
      const chip = document.createElement('div');
      chip.className = 'float-chip';
      chip.textContent = text;
      chip.style.left = `${x}px`;
      chip.style.top = `${y}px`;
      document.body.appendChild(chip);
      setTimeout(() => chip.remove(), 700);
    }

    function submitWord() {
      const word = activePath.map(idx => gridTiles[idx].char).join('');
      const bannerRect = spelledBanner.getBoundingClientRect();
      totalAttemptsOnBoard++;

      if (currentTargets.includes(word) && !solvedTargets.has(word)) {
        solvedTargets.add(word);
        sound.success();
        score += word.length * 60;
        showFloatScore(`+${word.length * 60}`, bannerRect.left + 40, bannerRect.top - 10);

        const row = document.querySelector(`.word-row[data-word="${word}"]`);
        if (row) {
          const cells = row.querySelectorAll('.ladder-cell');
          cells.forEach((cell, i) => {
            cell.textContent = word[i];
            cell.classList.add('solved');
          });
        }

        updateHeaderStats();
        clearSelection();
        setTimeout(pruneUnneededLetters, 300);
        return;
      }

      if (fullDictionarySet.has(word) && !bonusWordsFound.has(word) && !currentTargets.includes(word)) {
        bonusWordsFound.add(word);
        sound.success();
        score += 25;
        showFloatScore(`+25 (${word})`, bannerRect.left + 25, bannerRect.top - 10);
        updateHeaderStats();
        clearSelection();
        return;
      }

      if (solvedTargets.has(word) || bonusWordsFound.has(word)) {
        totalAttemptsOnBoard--;
        sound.tap();
        clearSelection();
        return;
      }

      wrongGuessesOnBoard++;
      sound.error();
      spelledBanner.classList.add('shake');
      setTimeout(() => {
        spelledBanner.classList.remove('shake');
        clearSelection();
      }, 400);
    }

    document.getElementById('hintBtn').addEventListener('click', () => {
      const remaining = currentTargets.filter(w => !solvedTargets.has(w));
      if (remaining.length === 0) return;

      const activeTiles = gridTiles.filter(t => !t.dismissed);
      let targetWord = null;
      let pathIndices = null;

      for (const w of remaining) {
        const p = findWordPath(w, activeTiles);
        if (p) {
          targetWord = w;
          pathIndices = p;
          break;
        }
      }

      if (!pathIndices) return;

      sound.tap();
      pathIndices.forEach(idx => gridTiles[idx].el.classList.add('hint-flash'));

      const row = document.querySelector(`.word-row[data-word="${targetWord}"]`);
      if (row) {
        const emptyCells = Array.from(row.querySelectorAll('.ladder-cell')).filter(c => !c.textContent);
        if (emptyCells.length > 0) {
          const cell = emptyCells[0];
          const idx = parseInt(cell.dataset.index, 10);
          cell.textContent = targetWord[idx];
          cell.style.color = '#ffd54f';
        }
      }

      score = Math.max(0, score - 20);
      updateHeaderStats();

      setTimeout(() => {
        pathIndices.forEach(idx => gridTiles[idx].el.classList.remove('hint-flash'));
      }, 1500);
    });

    document.getElementById('soundBtn').addEventListener('click', (e) => {
      sound.enabled = !sound.enabled;
      e.currentTarget.textContent = sound.enabled ? '🔊' : '🔇';
    });

    document.getElementById('nextLevelBtn').addEventListener('click', () => {
      boardNumber++;
      startNewBoard();
    });

    loadDictionaries();
  </script>
</body>
</html>
